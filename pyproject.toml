[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "columbus"
description = "Local polyglot repository graphs and bounded context for coding agents"
keywords = ["code-graph", "repository", "agent", "context", "mcp", "polyglot"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version", "dependencies"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
mcp = ["mcp==2.1.1"]

[project.scripts]
columbus = "columbus.cli:main"

[project.urls]
Homepage = "https://github.com/ch4570/columbus"
Documentation = "https://github.com/ch4570/columbus#readme"
Issues = "https://github.com/ch4570/columbus/issues"

[tool.setuptools]
package-dir = {"columbus" = "skills/columbus/scripts/columbus"}
packages = ["columbus"]
include-package-data = false

[tool.setuptools.dynamic]
# Resolve the literal package file, since scripts/columbus.py is also present.
version = {attr = "columbus.__init__.__version__"}
dependencies = {file = ["skills/columbus/scripts/requirements.txt"]}
