name: Portable distribution

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install parser and optional MCP test dependencies
        run: python -m pip install -r skills/columbus/scripts/requirements.txt -r skills/columbus/scripts/requirements-mcp.txt
      - name: Bootstrap and archive tests
        run: python -m unittest discover -s tests -v
      - name: Engine tests
        working-directory: skills/columbus/scripts
        run: python -m unittest discover -s tests -v
      - name: Observation harness tests (no model calls)
        run: python -m unittest discover -s evals/exploration -p "test_*.py" -v
      - name: CLI delivery observations (no model calls)
        run: python scripts/observe_delivery.py
      - name: Compile Python sources
        run: python -m compileall -q bootstrap.py install.py get-columbus.py run.py scripts skills/columbus/scripts evals/exploration
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Build reproducible ZIP
        run: python scripts/build_bundle.py
      - name: Assemble checksummed release assets
        run: python scripts/release_assets.py
      - name: Verify clean install and portable bundle
        run: python -c "import pathlib, subprocess, sys; p = pathlib.Path('dist'); subprocess.run([sys.executable, 'scripts/verify_distribution.py', '--wheel', str(next(p.glob('*.whl'))), '--bundle', str(next(p.glob('*.zip')))], check=True)"
      - name: Verify pre-commit partial staging and deletion-only updates
        run: |
          python -m pip install pre-commit==4.6.2
          python -m pre_commit validate-manifest .pre-commit-hooks.yaml
          python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, 'scripts/verify_pre_commit.py', '--wheel', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: columbus-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
